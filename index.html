    <head>
    <title>Icon Template Square</title>

        <style>
            .row{
                width:720px;
                margin: 10px auto 10px auto ;
            }
            .image-container {
                display: table-cell;
                vertical-align: middle;
                padding:20px;
            }
        </style>

    <body style="background-color: #404040;">
     <style>
    .glow-icon {
        position: relative;width: 200px;
        height: 200px;transform: translateX(20px);
    }

    .glow-icon .main,
    .glow-icon .glow {
        position: absolute;
        width: 235px;
        height: 235px;
        left: -5px;
        top: 15px;
    }
    .glow-icon:hover .glow 
    {animation: glowPulse 2s infinite ease-in-out;}
    @keyframes glowPulse 
    {0%, 100% {opacity: 0.2;} 50% {opacity: 1;}}
.planet-container svg {
    width: 117%;
    height: 117%;
    transform: translate(-5%, -5%);
}
#satelliteBox {
  position: relative;
  width: 200px;
  height: 200px;top:10px;left:10px
}
#satellite,
#glow2 {
  position: absolute;
  left: 0;
  top: 0;
  width: 240px;height: 240px;
}

#glow2 {
  opacity: 0;
  z-index: 1;
  left:20px;}

#satellite {
  z-index: 2;}
#satelliteBox:hover #satellite {
  animation: satelliteFloat 3.5s ease-in-out infinite;
}
#satelliteBox:hover #glow2 {
  animation: glowEffect 3.5s ease-in-out infinite;
}
@keyframes satelliteFloat {
  0% {transform: translate(-5px, -2px); }
 50% {transform: translate(5px, 2px); }
100% {transform: translate(-5px, -2px);}
}
@keyframes glowEffect {
  0% {opacity: 0.1;transform: scale(0.95);}
 50% {opacity: 0.6;transform: scale(1.05);}
100% {opacity: 0.1;transform: scale(0.95);}
}

.rocket-container {
    position: relative;
    width: 200px;
    height: 200px
}

.rocket-container .rocket {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    z-index: 1;
}

.rocket-container .shapes {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    z-index: 2;

    transform-origin: center center;
    transform: scale(1);
}
.rocket-container:hover .shapes {
    animation: rocketExplode 0.7s cubic-bezier(.34, 1.56, .64, 1) forwards;
}

@keyframes rocketExplode {
    0% {
        opacity: 0;
        transform: scale(0.55);
    }

    45% {
        opacity: 1;
        transform: scale(1.05);
    }

    75% {
        transform: scale(0.98);
    }

    100% {
        opacity: 1;
        transform: scale(1);
    }
}

.glasses-container {
    position: relative;
    width: 200px;
    height: 200px
}

.glasses-container img {
    position: absolute;
    top: -15px;
    left: 5px;
    width: 93%;
    height: 93%;
    object-fit: contain;
}

.glasses {
    z-index: 2;
}

.glow {
    z-index: 1;
    opacity: 0.8;
}

.glasses-container:hover .glow {
    animation: glowEffect 2.5s ease-in-out infinite;
}

@keyframes glowEffect {
    0% {
        opacity: 0.5;
    }

    50% {
        opacity: 1;
    }

    100% {
        opacity: 0.5;
    }
}

.submarine-container {
    position: relative;
    width: 200px;
    height: 200px;
    overflow: visible;
}

.submarine-container img {
    position: absolute;
    top: 0;
    left: 18px;
    width: 250px;height: 245px
}
@keyframes bubbleUp {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }

    70% {
        opacity: 0.7;
    }

    100% {
        transform: translate(6px, -18px) scale(1.1);
        opacity: 0;
    }
}
.submarine-container:hover .bubble1 {
    animation: bubbleUp 1.5s ease-out infinite;
}
@keyframes bubbleUp2 {
    0% {
        transform: translate(0, 0) scale(1);
        opacity: 1;
    }

    70% {
        opacity: 0.7;
    }

    100% {
        transform: translate(-1px, -28px) scale(1.1);
        opacity: 0;
    }
}

.submarine-container:hover .bubble2 {
    animation: bubbleUp2 1.5s ease-out 0.3s infinite;
}
.submarine-container:hover .bubble3 {
    animation: bubbleUp 1.5s ease-out 0.25s infinite;
}
.submarine-container:hover .bubble4 {
    animation: bubbleUp 1.5s ease-out 0.55s infinite;
}

.chip-container {
    position: relative;
    width: 200px;
    height: 200px;
}

.chip-container .chip {
    position: absolute;
    top: 40px;
    left: 25px;
    width: 180px;
    height: 180px;
}

.chip-path {
    position: absolute;
    top: 40px;
    left: 25px;
    width: 180px;
    height: 180px;
}

#chipOutline {
    fill: none;
    stroke: none;
}

#chipLight {
    fill: none;
    stroke: #fff36a;
    stroke-width: 3;
    stroke-linecap: round;

    filter:
        drop-shadow(0 0 2px #fff36a)
        drop-shadow(0 0 4px #ffd900);

    opacity: 0;
}

.chip-container:hover #chipLight {
    opacity: 1;
}

.robot-container{
    position:relative;
    width:200px;
    height:200px;
}

.robot-body,
.robot-eyes {
    position: absolute;
    top: 0;
    left: 0;
}

.robot-body {
    width: 100%;left: 42px;top: 20px;
}

.robot-eyes {
    width: 70px;
    left: 115px;
    top: 132px;
}
@keyframes blink{

0%,100%{
    transform:scaleY(1);
}

45%{
    transform:scaleY(0.2);
}

55%{
    transform:scaleY(0.2);
}
}
.robot-container:hover .robot-eyes{
    animation: blink .4s ease;
  }

.speech-container {
    width: 200px;
    height: 200px;}

.speech {
    width: 250px;
    height: 206.6px;
    left: 41px;
    top: 15px;
    display: block;
    position: relative;
    z-index: 10;
    transform-origin: center center;}

.speech-container:hover .speech {
    animation: speechPop 0.6s ease-out forwards;
}

@keyframes speechPop {
    0% {transform: scale(0.15);
        opacity: 0;}

    45% {transform: scale(1.08);
        opacity: 1z}

    65% {transform: scale(0.96);}

    82% {transform: scale(1.03);}

    100% {transform: scale(1);}
}
